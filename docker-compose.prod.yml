services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: roxan-turcotte-backend:latest
    container_name: roxan-turcotte-backend
    restart: always
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3010"
      DATABASE_PATH: /app/data/roxan.sqlite
      # Roxan's real client-facing domain. Used by:
      #   - CORS allow-list (app.js)
      #   - Email templates footer / confirmation body (mail/index.js)
      #   - Any absolute link generated server-side
      # The umbeli hostname stays reachable as a fallback (see VIRTUAL_HOST on
      # the frontend service) so the site keeps working during DNS switch-over.
      PUBLIC_BASE_URL: https://rturcotte.ca
      PUBLIC_SITE_URL: https://rturcotte.ca
      COOKIE_SECURE: "true"
      # The .env shipped from local sets RATE_LIMIT_MAX=10 (intended for the
      # public contact/quote forms), but app.js applies the same limiter to
      # /api/admin/* — at 10/minute, normal admin usage (login, /me, listing
      # leads) hits 429. Bump it here to keep both surfaces happy.
      RATE_LIMIT_MAX: "60"
    volumes:
      - roxan_turcotte_data:/app/data
      - roxan_turcotte_uploads:/app/uploads
    networks:
      - app_network

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: /api
        PUBLIC_BASE: /
        # Baked into the SSG output for canonical URLs, OG tags, sitemap, JSON-LD.
        PUBLIC_SITE_URL: https://rturcotte.ca
    image: roxan-turcotte-frontend:latest
    container_name: roxan-turcotte-frontend
    restart: always
    depends_on:
      - backend
    expose:
      - "80"
    environment:
      # rturcotte.ca + www are the client-facing hostnames. turcotte.umbeli.com
      # is kept as a fallback / staging URL while DNS is being switched. Lets
      # Encrypt will issue a SAN cert covering all three IF the DNS records for
      # rturcotte.ca / www.rturcotte.ca resolve to 216.128.182.26; until then
      # the umbeli hostname keeps serving.
      - VIRTUAL_HOST=rturcotte.ca,www.rturcotte.ca,turcotte.umbeli.com
      - LETSENCRYPT_HOST=rturcotte.ca,www.rturcotte.ca,turcotte.umbeli.com
      - LETSENCRYPT_EMAIL=admin@umbeli.com
      - VIRTUAL_PORT=80
    networks:
      - app_network

volumes:
  roxan_turcotte_data:
  roxan_turcotte_uploads:

networks:
  app_network:
    external: true
    name: app_network
